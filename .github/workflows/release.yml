# Obsidian 플러그인 릴리스
#
# 태그 push 시 빌드 후 GitHub Release에
# main.js, manifest.json, styles.css를 업로드합니다.
#
# Obsidian은 manifest.json version과 동일한 release tag에서 파일을 받습니다.
# 예: version 1.0.3 → tag 1.0.3 (v 접두사 사용 금지)
#
# 릴리스 방법:
#   git tag -a 1.0.3 -m "1.0.3"
#   git push origin 1.0.3

name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: choihunchul/github--actions/.github/workflows/release-obsidian-plugin.yml@main
    with:
      build-command: npm run build
      draft: false
